# Builds the ready-to-run Windows package on every push to main and publishes it as the release "latest":
#   https://github.com/TEA-CoderR/CasaTeCopy/releases/download/latest/CasaTeCopy.zip
# 更新.bat on the user's computer downloads that zip (no Git, npm or build needed there).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: node scripts/package-local.mjs

      - name: Zip
        run: |
          test -f release/CasaTeCopy/server.mjs
          test -f release/CasaTeCopy/dist/catalog.html
          cd release/CasaTeCopy
          zip -qr ../../CasaTeCopy.zip . -x 'saved_images/*'
          cd ../..
          ls -l CasaTeCopy.zip

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CasaTeCopy.zip \
            --target "$GITHUB_SHA" \
            --title "最新版本 $(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" \
            --notes "自动打包。用法：在 D:\\CasaTeCopy 里双击「更新.bat」。$(git log -1 --pretty=%s)" \
            --latest
